<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E6BFF"/>
      <stop offset="0.55" stop-color="#5B3FE0"/>
      <stop offset="1" stop-color="#2C1A9A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9D2FF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A5E"/>
      <stop offset="1" stop-color="#120C36"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DF0C0"/>
      <stop offset="1" stop-color="#7CF7FF"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BF08A"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- Background tile on the macOS icon grid: 824pt in a 1024pt canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- Soft shadow under the phone. -->
  <rect x="330" y="218" width="364" height="604" rx="80" fill="#120C36" opacity="0.22"/>

  <!-- Phone. -->
  <rect x="330" y="206" width="364" height="604" rx="80" fill="url(#body)"/>
  <rect x="354" y="230" width="316" height="556" rx="58" fill="url(#screen)"/>
  <rect x="464" y="254" width="96" height="28" rx="14" fill="#07051A"/>

  <!-- Activity trace. -->
  <path d="M388 540 H434 L468 446 L512 648 L556 404 L596 580 L616 540 H636"
        fill="none" stroke="url(#pulse)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Running indicator, as on a booted row in the app. -->
  <circle cx="694" cy="790" r="86" fill="#3A25B0"/>
  <circle cx="694" cy="790" r="62" fill="url(#dot)"/>
</svg>
